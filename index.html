<!-- Sección de Confirmación de Asistencia (RSVP) -->
<section style="max-width: 500px; margin: 40px auto; padding: 25px; background-color: #f9f9f9; border-radius: 12px; font-family: 'Segoe UI', sans-serif; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center;">

  <h2 style="color: #4A4A4A; margin-bottom: 10px; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px;">
    Confirmación de Asistencia
  </h2>
  <p style="color: #666; font-size: 0.95rem; margin-bottom: 20px;">
    Por favor, confirma tu asistencia para acompañarnos en este día tan especial.
  </p>

  <!-- Formulario conectado a tu cuenta de Formspree -->
  <form action="https://formspree.io/f/mljrlzjb" method="POST" style="display: flex; flex-direction: column; gap: 15px; text-align: left;">
    
    <!-- Nombre Completo -->
    <div>
      <label style="display: block; font-weight: 600; margin-bottom: 5px; color: #333;">Nombre completo:</label>
      <input type="text" name="nombre_invitado" required placeholder="Ej. María López" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
    </div>

    <!-- ¿Asistirá? -->
    <div>
      <label style="display: block; font-weight: 600; margin-bottom: 5px; color: #333;">¿Asistirás al evento?</label>
      <select name="asistencia" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; background-color: #fff;">
        <option value="" disabled selected>Selecciona una opción</option>
        <option value="Sí asistiré">¡Sí, ahí estaré!</option>
        <option value="No podré asistir">Lo siento, no podré asistir</option>
      </select>
    </div>

    <!-- Número de Pases / Acompañantes -->
    <div>
      <label style="display: block; font-weight: 600; margin-bottom: 5px; color: #333;">Número de personas que asisten:</label>
      <input type="number" name="numero_personas" min="1" max="10" value="1" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
    </div>

    <!-- Mensaje (Opcional) -->
    <div>
      <label style="display: block; font-weight: 600; margin-bottom: 5px; color: #333;">Mensaje para la festejada (opcional):</label>
      <textarea name="mensaje" rows="3" placeholder="Escribe un mensaje de felicitación..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;"></textarea>
    </div>

    <!-- Botón de Envío -->
    <button type="submit" style="background-color: #315A68; color: white; border: none; padding: 12px; font-size: 1rem; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: background 0.3s;">
      Enviar Confirmación
    </button>

  </form>

</section>
